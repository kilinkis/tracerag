name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.5-pg17-trixie
        env:
          POSTGRES_DB: tracerag_test
          POSTGRES_USER: tracerag
          POSTGRES_PASSWORD: tracerag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tracerag -d tracerag_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TRACERAG_TEST_DATABASE_URL: postgresql://tracerag:tracerag@localhost:5432/tracerag_test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Official uv GitHub Actions integration:
      # https://docs.astral.sh/uv/guides/integration/github/
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          enable-cache: true
          python-version: "3.13"

      - name: Verify lockfile
        run: uv lock --check

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest --cov=tracerag --cov-report=term-missing
